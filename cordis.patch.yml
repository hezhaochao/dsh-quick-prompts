# dsh-quick-prompts 的 bundle patch —— 把快捷提示词插件挂进 DSH 配置树
#
# DSH 启动时按 bundle 层栈把各插件的 patch 叠成配置树。本文件声明一层：
# 在树上插一行 id 为 quick-prompts 的条目，name 解析到本包入口 lib/index.js。
# 因为 package.json 声明了 dsh.client，宿主的模块系统同时会把本包扫描为
# 浏览器插件，向页面提供 /plugins/dsh-quick-prompts/client.js。

- insert:
    - id: quick-prompts
      name: 'dsh-quick-prompts'
